                - cell "566,50 €" [ref=f6e214]
              - row [ref=f6e215]:
                - cell "Tarif maîtrisé" [ref=f6e216]
                - cell "Céramique hors zircone" [ref=f6e217]
                - cell "2es prémolaires et molaires" [ref=f6e218]
                - cell "566,50 €" [ref=f6e219]
              - row [ref=f6e220]:
                - cell "Tarif libre" [ref=f6e221]
                - cell "Céramo-céramique, alliage précieux, céramo-métallique sur molaire, couronne sur implant" [ref=f6e222]
                - cell "Selon la dent" [ref=f6e223]
                - cell "Honoraires libres" [ref=f6e224]
          - paragraph [ref=f6e225]: Dans tous les cas, l'Assurance Maladie rembourse 60 % d'une base de 120 €, soit 72 € par couronne sur dent naturelle. Pour une couronne sur implant, la base est de 107,50 €, soit 64,50 €. La couronne provisoire et l'inlay-core ont leur propre base et leur propre plafond.
          - paragraph [ref=f6e226]: "Le reste à charge zéro du panier 100 % Santé suppose deux conditions : un dentiste conventionné, ce qui est le cas du cabinet, et une complémentaire santé responsable, ce qui est le cas de la grande majorité des contrats."
          - generic [ref=f6e227]:
            - strong [ref=f6e228]: Bon à savoir.
            - text: Le décret n° 2026-809, publié au Journal officiel le 22 août 2026, prévoit que le taux de remboursement des soins dentaires par l'Assurance Maladie pourrait baisser au 1er janvier 2027. Le taux exact n'est pas encore fixé. Pour les couronnes du panier 100 % Santé, la complémentaire responsable couvre la différence.
          - paragraph [ref=f6e229]:
            - strong [ref=f6e230]: "Honoraires du cabinet :"
            - mark [ref=f6e231]: "À COMPLÉTER : honoraires pratiqués par type de couronne, ou renvoi vers la page Honoraires & remboursement"
            - text: . Le cabinet accepte la carte Vitale, la carte bancaire, les espèces, le chèque et le virement. Voir aussi
            - link "honoraires et remboursements" [ref=f6e232] [cursor=pointer]:
              - /url: https://dr-patrick-lellouche.chirurgiens-dentistes.fr/blog/articles/honoraires-et-remboursements
            - text: .
