        - heading "Les alternatives à la couronne" [level=2] [ref=f6e235]
        - generic [ref=f6e236]:
          - paragraph [ref=f6e237]: "Selon l'état de la dent, d'autres solutions peuvent être discutées :"
          - list [ref=f6e238]:
