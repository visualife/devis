      - generic [ref=f6e97]:
        - heading "Qu'est-ce qu'une couronne dentaire ?" [level=2] [ref=f6e98]
        - generic [ref=f6e99]:
          - paragraph [ref=f6e100]:
            - text: Une couronne dentaire est une prothèse fixe qui recouvre et protège une dent très abîmée, ou qui se fixe sur un
            - link "implant" [ref=f6e101] [cursor=pointer]:
              - /url: implant-dentaire-charenton-le-pont.html
            - text: .
          - paragraph [ref=f6e102]: "Une couronne dentaire est une coiffe fabriquée sur mesure qui reproduit la forme et la couleur d'une dent, et qui vient la recouvrir entièrement. Elle est scellée ou collée de façon définitive : on ne la retire pas."
          - paragraph [ref=f6e103]: On parle de couronne dento-portée quand elle est posée sur votre dent naturelle, et de couronne implanto-portée, ou couronne sur implant, quand elle est fixée sur un implant.
          - paragraph [ref=f6e104]: Elle se pose en général en deux séances, avec une couronne provisoire entre les deux.
          - paragraph [ref=f6e105]: "Plusieurs couronnes sont intégralement remboursées dans le cadre du 100 % Santé, si votre mutuelle est un contrat responsable : la couronne métallique et la couronne zircone sur toutes les dents, la céramo-métallique et la céramique hors zircone sur les dents de devant."
          - paragraph [ref=f6e106]: Le cabinet du Dr Patrick Lellouche, conventionné, se trouve au 139 rue de Paris à Charenton-le-Pont, au pied du métro Liberté. Un devis vous est remis avant tout traitement prothétique.
      - img "Instruments de contrôle posés sur un modèle de dents avec couronnes" [ref=f6e108]
      - generic [ref=f6e110]:
        - heading "Dans quels cas pose-t-on une couronne ?" [level=2] [ref=f6e111]
        - generic [ref=f6e112]:
          - paragraph [ref=f6e113]: Une couronne est indiquée lorsqu'une dent est trop abîmée pour être réparée par un simple plombage ou un composite.
          - paragraph [ref=f6e114]: "Les situations les plus courantes :"
          - list [ref=f6e115]:
            - listitem [ref=f6e116]: une dent dévitalisée, devenue plus fragile ;
            - listitem [ref=f6e117]: une grosse carie ou un ancien plombage très étendu ;
            - listitem [ref=f6e118]: une dent fêlée ou cassée ;
            - listitem [ref=f6e119]: une dent usée ou très abîmée ;
            - listitem [ref=f6e120]: le remplacement d'une dent absente, sur un implant.
          - paragraph [ref=f6e121]:
            - text: Quand la dent est encore assez solide, une solution plus conservatrice comme
            - link "l'inlay ou l'onlay" [ref=f6e122] [cursor=pointer]:
              - /url: https://dr-patrick-lellouche.chirurgiens-dentistes.fr/blog/articles/inlay-et-onlay-une-technique-conservatrice
            - text: peut suffire. Le Dr Lellouche vous indique ce qui est possible après examen.
      - generic [ref=f6e124]:
        - 'heading "Les matériaux : céramique, zircone, céramo-métallique ou métal" [level=2] [ref=f6e125]'
        - generic [ref=f6e126]:
          - paragraph [ref=f6e127]: Le choix du matériau dépend de la place de la dent, de la force de votre mastication et de l'esthétique recherchée. Il a aussi une incidence directe sur le remboursement.
          - paragraph [ref=f6e128]:
            - strong [ref=f6e129]: La couronne céramo-métallique
            - text: ": une armature en métal recouverte de céramique. C'est un matériau ancien et éprouvé, mais le métal peut laisser apparaître un liseré gris au bord de la gencive avec le temps."
          - paragraph [ref=f6e130]:
            - strong [ref=f6e131]: La couronne zircone
            - text: ": une céramique très résistante, sans métal, qui convient aux dents de devant comme aux molaires. Depuis le 1er janvier 2026, elle fait partie du panier 100 % Santé sur toutes les dents."
          - paragraph [ref=f6e132]:
            - strong [ref=f6e133]: La couronne céramique hors zircone
            - text: ", par exemple en disilicate de lithium, ou la céramo-céramique : sans métal, avec une translucidité proche de l'émail naturel. On la réserve plutôt aux dents visibles."
          - paragraph [ref=f6e134]:
            - strong [ref=f6e135]: La couronne métallique
            - text: ": la plus discrète en épaisseur et la plus solide, mais grise. On la propose surtout pour les dents du fond."
          - paragraph [ref=f6e136]: "La couronne provisoire, en résine, n'est pas un matériau à choisir : elle protège la dent pendant la fabrication de la couronne définitive."
          - paragraph [ref=f6e137]:
            - mark [ref=f6e138]: "À COMPLÉTER : préciser les matériaux habituellement proposés au cabinet et si les couronnes sont fabriquées par un laboratoire, ainsi que son lieu de fabrication en France, dans l'UE ou hors UE, information qui doit figurer sur le devis."
      - img "Teintier de couronnes dentaires et instruments sur un champ blanc" [ref=f6e140]
      - generic [ref=f6e142]:
        - heading "Les étapes de la pose au cabinet" [level=2] [ref=f6e143]
        - generic [ref=f6e144]:
          - paragraph [ref=f6e145]: La pose d'une couronne demande en général deux séances, espacées de quelques jours à deux semaines.
          - list [ref=f6e146]:
            - listitem [ref=f6e147]:
              - heading "L'examen et le devis" [level=3] [ref=f6e148]
              - paragraph [ref=f6e149]: Le praticien examine la dent et fait une radio. Si la dent est infectée, un traitement de canal (dévitalisation) est réalisé d'abord. Vous recevez ensuite un devis qui présente le traitement proposé et une alternative du panier 100 % Santé.
            - listitem [ref=f6e150]:
              - heading "La préparation de la dent et l'empreinte" [level=3] [ref=f6e151]
              - paragraph [ref=f6e152]:
                - text: Sous anesthésie locale, la dent est taillée pour laisser la place à la couronne. Si elle est très délabrée, on peut d'abord poser un inlay-core, un ancrage dans la racine qui sert de support. Une empreinte est ensuite prise
                - mark [ref=f6e153]: "À COMPLÉTER : empreinte classique ou caméra optique au cabinet"
                - text: ", puis une couronne provisoire est posée."
            - listitem [ref=f6e154]:
              - heading "La pose de la couronne définitive" [level=3] [ref=f6e155]
              - paragraph [ref=f6e156]: La couronne provisoire est retirée. La couronne définitive est essayée, sa teinte et son contact avec les dents opposées sont vérifiés, puis elle est scellée ou collée. Cette séance se fait le plus souvent sans anesthésie.
      - generic [ref=f6e158]:
        - heading "Est-ce douloureux ?" [level=2] [ref=f6e159]
        - generic [ref=f6e160]:
          - paragraph [ref=f6e161]: La préparation de la dent se fait sous anesthésie locale lorsque la dent est vivante. Vous ne devriez pas avoir mal pendant la séance.
          - paragraph [ref=f6e162]: "Après coup, une sensibilité au chaud et au froid ou une gencive un peu irritée sont fréquentes pendant quelques jours. Avec la couronne provisoire, évitez de mâcher des aliments durs ou collants de ce côté. Si la provisoire se décolle, appelez le cabinet : il ne faut pas laisser la dent taillée à nu plusieurs jours."
      - img "Contrôle d'une dent au miroir et à la sonde lors d'un examen dentaire" [ref=f6e164]
      - generic [ref=f6e166]:
        - heading "Durée de vie et entretien" [level=2] [ref=f6e167]
        - generic [ref=f6e168]:
          - paragraph [ref=f6e169]: "Une couronne dure souvent dix à quinze ans, parfois beaucoup plus. Ce qui limite sa durée de vie, c'est surtout la dent qui la porte : une carie qui se forme au bord de la couronne, une fracture de la racine ou une maladie des gencives."
          - paragraph [ref=f6e170]: "Pour la faire durer :"
          - list [ref=f6e171]:
            - listitem [ref=f6e172]: brossez-vous les dents deux fois par jour, en insistant sur la jonction entre la couronne et la gencive ;
            - listitem [ref=f6e173]: passez du fil ou une brossette interdentaire chaque jour ;
            - listitem [ref=f6e174]: "si vous serrez ou grincez des dents la nuit, parlez-en : une gouttière de protection peut être proposée ;"
            - listitem [ref=f6e175]: venez en contrôle régulièrement, au moins une fois par an.
      - generic [ref=f6e177]:
        - heading "Risques et limites" [level=2] [ref=f6e178]
        - paragraph [ref=f6e180]: La couronne est un traitement courant, mais il n'est pas anodin. Tailler une dent vivante peut l'irriter, et il arrive qu'une dévitalisation devienne nécessaire plus tard. La céramique peut s'écailler, une couronne peut se desceller, et une carie peut apparaître sous son bord si l'hygiène est insuffisante. Ces risques sont expliqués lors de la consultation et rappelés dans le devis.
      - generic [ref=f6e182]:
        - heading "Prix et remboursement d'une couronne en France" [level=2] [ref=f6e183]
        - generic [ref=f6e184]:
          - paragraph [ref=f6e185]: Le prix d'une couronne dépend de son matériau et de la dent concernée. Depuis la réforme 100 % Santé, chaque couronne appartient à l'un des trois paniers suivants. Montants maximum en vigueur au 1er janvier 2026, selon l'Assurance Maladie.
          - table [ref=f6e187]:
            - rowgroup [ref=f6e188]:
              - row [ref=f6e189]:
                - columnheader "Panier" [ref=f6e190]
                - columnheader "Couronne" [ref=f6e191]
                - columnheader "Dents concernées" [ref=f6e192]
                - columnheader "Montant maximum" [ref=f6e193]
            - rowgroup [ref=f6e194]:
              - row [ref=f6e195]:
                - cell "100 % Santé" [ref=f6e196]
